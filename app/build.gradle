apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (System.getenv('TRU_KS_PATH') != null) {
            tru {
                storeFile file(System.getenv('TRU_KS_PATH'))
                storePassword System.getenv('TRU_KEYSTORE_PASS')
                keyAlias 'tru'
                keyPassword System.getenv('TRU_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false

            if (System.getenv('TRU_KS_PATH') != null) {
                signingConfig signingConfigs.tru
            }

            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }

            if (System.getenv('TRU_KS_PATH') != null) {
                signingConfig signingConfigs.tru
            }
            else {
                signingConfig signingConfigs.debug
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
