name: build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK предустановлен на runner'е; принимаем лицензии и ставим pinned NDK/CMake
      - name: Accept Android SDK licenses & install pinned components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;24.0.8215888" "cmake;3.22.1" >/dev/null
          echo "SDK ready: $ANDROID_HOME"

      - name: Restore signing keystore
        env:
          TRU_KEYSTORE_B64: ${{ secrets.TRU_KEYSTORE_B64 }}
        run: |
          echo "$TRU_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/tru-release.keystore"
          echo "keystore restored"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (debug, stable signature)
        env:
          TRU_KS_PATH: ${{ github.workspace }}/tru-release.keystore
          TRU_KEYSTORE_PASS: ${{ secrets.TRU_KEYSTORE_PASS }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tru-launcher-apk
          path: |
            app/build/outputs/apk/debug/*.apk

      - name: Attach APK to run page
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: TRU Launch APK
          files: app/build/outputs/apk/debug/*.apk
          allow_updates: true
